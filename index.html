
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#07111f">
  <title>Beyond Horizons</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #07111f;
      color: #f3f7ff;
      font-family: Arial, sans-serif;
    }
    header {
      padding: 22px;
      border-bottom: 1px solid #24364b;
      font-weight: bold;
      letter-spacing: 2px;
    }
    main {
      min-height: 75vh;
      display: grid;
      place-content: center;
      text-align: center;
      padding: 24px;
      background: radial-gradient(ellipse at top, #16445b, #07111f 65%);
    }
    h1 { font-size: clamp(34px, 8vw, 64px); margin-bottom: 12px; }
    p { color: #b8c8dc; line-height: 1.6; }
    button {
      margin-top: 18px;
      padding: 14px 24px;
      background: #65e6c1;
      color: #07111f;
      border: 0;
      border-radius: 8px;
      font-weight: bold;
      font-size: 16px;
    }
    footer { padding: 18px; text-align: center; color: #8295aa; }
  </style>
</head>
<body>
  <header>BEYOND HORIZONS</header>
  <main>
    <div>
      <p>ENTER A WORLD WITHOUT LIMITS</p>
      <h1>Your horizon.<br>Your battle.</h1>
      <p>Explore a new world. Build your legacy.</p>
      <button onclick="alert('Welcome to Beyond Horizons!')">
        ENTER THE WORLD
      </button>
    </div>
  </main>
  <footer>BEYOND HORIZONS · GAME PROJECT</footer>
</body>
</html>
