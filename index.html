 
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#07111f">
<title>Beyond Horizons — Arena</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#07111f;color:#f2f7ff;font:14px Arial;overflow:hidden;touch-action:none}
header{height:52px;padding:16px;display:flex;justify-content:space-between;background:#101c2b}
header b{letter-spacing:1px}header span{color:#65e6c1}
#hud{position:absolute;top:62px;left:12px;right:12px;display:flex;justify-content:space-between;pointer-events:none;gap:8px}
.pill{background:#101c2bdd;border:1px solid #395069;border-radius:8px;padding:9px 11px}
#health{color:#65e6c1;font-weight:bold}
canvas{display:block;width:100vw;height:calc(100dvh - 52px);touch-action:none}
#controls{position:absolute;bottom:18px;left:0;right:0;display:flex;justify-content:space-between;align-items:end;padding:0 18px;pointer-events:none}
.pad{display:grid;grid-template-columns:48px 48px 48px;grid-template-rows:48px 48px 48px;gap:4px;pointer-events:auto}
.ctrl{border:1px solid #9eb5c766;background:#15263bd9;color:white;border-radius:12px;font-size:20px;touch-action:none}
.up{grid-column:2}.left{grid-column:1;grid-row:2}.down{grid-column:2;grid-row:2}.right{grid-column:3;grid-row:2}
#fire{pointer-events:auto;border-radius:50%;width:78px;height:78px;background:#a83d4cdd;border:2px solid #ff8a96;color:white;font-weight:bold}
#overlay{position:absolute;inset:52px 0 0;background:#07111fee;display:grid;place-items:center;padding:22px;text-align:center}
.panel{max-width:390px;width:100%;padding:24px;border:1px solid #31475c;border-radius:16px;background:#101c2b}
h1{font-size:36px;margin:10px 0;color:#65e6c1}
p{color:#b8c8dc;line-height:1.5}
button.main{background:#65e6c1;color:#07111f;border:0;border-radius:9px;padding:14px 20px;font-weight:bold;font-size:15px}
.small{font-size:11px;color:#8ea4bb}
@media(min-width:800px){#controls{padding:0 40px}.pad{transform:scale(1.15);transform-origin:bottom left}}
</style>
</head>
<body>
<header><b>BEYOND <span>HORIZONS</span></b><b id="level">ARENA 01</b></header>
<div id="hud">
 <div class="pill">♥ <span id="health">100</span> HP</div>
 <div class="pill">SCORE <b id="score">0</b></div>
 <div class="pill">ENEMIES <b id="left">5</b></div>
</div>
<canvas id="game" aria-label="Top-down arena game"></canvas>
<div id="controls">
 <div class="pad">
  <button class="ctrl up" data-move="up">▲</button>
  <button class="ctrl left" data-move="left">◀</button>
  <button class="ctrl down" data-move="down">▼</button>
  <button class="ctrl right" data-move="right">▶</button>
 </div>
 <button id="fire">FIRE</button>
</div>
<div id="overlay">
 <div class="panel">
  <div class="small">SINGLE-PLAYER TRAINING SIMULATION</div>
  <h1>BEYOND<br>HORIZONS</h1>
  <p>Survive the arena, avoid opponents, and tap FIRE to defend yourself. Defeat all five opponents to win.</p>
  <button class="main" id="start">START MATCH</button>
  <p class="small">Mobile touch controls · Keyboard: WASD / arrows + Space</p>
 </div>
</div>
<script>
(function(){
'use strict';
const canvas=document.getElementById('game');
const ctx=canvas.getContext('2d');
const overlay=document.getElementById('overlay');
const start=document.getElementById('start');
const hpText=document.getElementById('health');
const scoreText=document.getElementById('score');
const leftText=document.getElementById('left');
const keys={};
let W=0,H=0,active=false,last=0,score=0,hp=100,enemies=[],shots=[],enemyShots=[];
const player={x:0,y:0,r:12,speed:190,fireCooldown:0,invuln:0};
const rand=(a,b)=>a+Math.random()*(b-a);
function resize(){
 const d=Math.min(window.devicePixelRatio||1,2);
 W=canvas.clientWidth;H=canvas.clientHeight;
 canvas.width=Math.round(W*d);canvas.height=Math.round(H*d);
 ctx.setTransform(d,0,0,d,0,0);
 if(!active){player.x=W/2;player.y=H/2}
 draw();
}
window.addEventListener('resize',resize);
function spawnEnemies(){
 enemies=[];
 for(let i=0;i<5;i++){
  let x,y;
  do{x=rand(35,W-35);y=rand(100,H-45)}
  while(Math.hypot(x-W/2,y-H/2)<Math.min(W,H)*.28);
  enemies.push({x,y,r:12,hp:2,speed:rand(28,48),cool:rand(.5,1.8),phase:rand(0,6)});
 }
}
function startGame(){
 hp=100;score=0;shots=[];enemyShots=[];active=true;
 player.x=W/2;player.y=H*.58;player.fireCooldown=0;player.invuln=1;
 spawnEnemies();overlay.style.display='none';updateHud();
 last=performance.now();requestAnimationFrame(loop);
}
start.addEventListener('click',startGame);
function updateHud(){
 hpText.textContent=hp;scoreText.textContent=score;leftText.textContent=enemies.length;
}
function endGame(won){
 active=false;
 overlay.style.display='grid';
 overlay.innerHTML='<div class="panel"><div class="small">MATCH COMPLETE</div><h1>'+ (won?'VICTORY':'MISSION OVER') +'</h1><p>'+ (won?'You cleared the arena!':'Your health reached zero. Try a different strategy.') +'</p><p>Final score: <b>'+score+'</b></p><button class="main" id="restart">PLAY AGAIN</button></div>';
 document.getElementById('restart').addEventListener('click',startGame);
}
function shoot(){
 if(!active||player.fireCooldown>0)return;
 player.fireCooldown=.24;
 let target=null,dist=Infinity;
 for(const e of enemies){
  const d=Math.hypot(e.x-player.x,e.y-player.y);
  if(d<dist){dist=d;target=e}
 }
 if(target){
  const a=Math.atan2(target.y-player.y,target.x-player.x);
  shots.push({x:player.x,y:player.y,vx:Math.cos(a)*440,vy:Math.sin(a)*440,life:.8});
 }else{
  shots.push({x:player.x,y:player.y,vx:0,vy:-440,life:.8});
 }
}
document.getElementById('fire').addEventListener('pointerdown',e=>{e.preventDefault();shoot()});
document.querySelectorAll('[data-move]').forEach(b=>{
 const k=b.dataset.move;
 b.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=true;b.setPointerCapture(e.pointerId)});
 for(const event of ['pointerup','pointercancel','lostpointercapture'])
  b.addEventListener(event,()=>keys[k]=false);
});
window.addEventListener('keydown',e=>{
 const k=e.key.toLowerCase();
 if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k))e.preventDefault();
 keys[k]=true;if(k===' ')shoot();
});
window.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
function loop(now){
 if(!active)return;
 const dt=Math.min((now-last)/1000,.035);last=now;
 update(dt);draw();
 if(active)requestAnimationFrame(loop);
}
function update(dt){
 let dx=0,dy=0;
 if(keys.left||keys.a||keys.arrowleft)dx--;
 if(keys.right||keys.d||keys.arrowright)dx++;
 if(keys.up||keys.w||keys.arrowup)dy--;
 if(keys.down||keys.s||keys.arrowdown)dy++;
 if(dx&&dy){dx*=.707;dy*=.707}
 player.x=Math.max(14,Math.min(W-14,player.x+dx*player.speed*dt));
 player.y=Math.max(75,Math.min(H-14,player.y+dy*player.speed*dt));
 player.fireCooldown=Math.max(0,player.fireCooldown-dt);
 player.invuln=Math.max(0,player.invuln-dt);
 for(const e of enemies){
  const a=Math.atan2(player.y-e.y,player.x-e.x);
  const d=Math.hypot(player.x-e.x,player.y-e.y);
  if(d>30){e.x+=Math.cos(a)*e.speed*dt;e.y+=Math.sin(a)*e.speed*dt}
  e.cool-=dt;
  if(e.cool<=0&&d<330){
   e.cool=rand(1.1,2.3);
   enemyShots.push({x:e.x,y:e.y,vx:Math.cos(a)*155,vy:Math.sin(a)*155,life:2});
  }
  if(d<player.r+e.r&&player.invuln<=0){hp-=18;player.invuln=.65;updateHud();if(hp<=0){hp=0;updateHud();endGame(false);return}}
 }
 for(let i=shots.length-1;i>=0;i--){
  const s=shots[i];s.x+=s.vx*dt;s.y+=s.vy*dt;s.life-=dt;
  let hit=false;
  for(let j=enemies.length-1;j>=0;j--){
   const e=enemies[j];
   if(Math.hypot(s.x-e.x,s.y-e.y)<e.r+4){
    e.hp--;hit=true;
    if(e.hp<=0){enemies.splice(j,1);score+=100;updateHud()}
    break;
   }
  }
  if(hit||s.life<=0||s.x<0||s.x>W||s.y<0||s.y>H)shots.splice(i,1);
 }
 for(let i=enemyShots.length-1;i>=0;i--){
  const s=enemyShots[i];s.x+=s.vx*dt;s.y+=s.vy*dt;s.life-=dt;
  if(Math.hypot(s.x-player.x,s.y-player.y)<player.r+4&&player.invuln<=0){
   hp-=10;player.invuln=.55;enemyShots.splice(i,1);updateHud();
   if(hp<=0){hp=0;updateHud();endGame(false);return}
  }else if(s.life<=0||s.x<0||s.x>W||s.y<0||s.y>H)enemyShots.splice(i,1);
 }
 if(enemies.length===0)endGame(true);
}
function draw(){
 ctx.clearRect(0,0,W,H);
 ctx.fillStyle='#0b1928';ctx.fillRect(0,0,W,H);
 const size=38;
 ctx.strokeStyle='#1d3548';ctx.lineWidth=1;
 for(let x=0;x<W;x+=size){ctx.beginPath();ctx.moveTo(x,52);ctx.lineTo(x,H);ctx.stroke()}
 for(let y=52;y<H;y+=size){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
 ctx.fillStyle='#142c3a';ctx.fillRect(18,95,Math.max(45,W*.16),65);
 ctx.fillRect(Math.max(30,W*.72),Math.max(145,H*.45),Math.min(90,W*.2),75);
 ctx.fillStyle='#29475a';ctx.fillRect(25,103,Math.max(31,W*.16-14),7);
 for(const s of shots){ctx.fillStyle='#ffe58a';ctx.beginPath();ctx.arc(s.x,s.y,4,0,Math.PI*2);ctx.fill()}
 for(const s of enemyShots){ctx.fillStyle='#ff6b7b';ctx.beginPath();ctx.arc(s.x,s.y,4,0,Math.PI*2);ctx.fill()}
 for(const e of enemies){
  ctx.fillStyle='#ff6379';ctx.beginPath();ctx.arc(e.x,e.y,e.r,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(e.x-3,e.y-2,2,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#432331';ctx.fillRect(e.x-13,e.y-19,26,4);
  ctx.fillStyle='#ff6379';ctx.fillRect(e.x-13,e.y-19,26*(e.hp/2),4);
 }
 ctx.save();
 ctx.globalAlpha=player.invuln>0?.55:1;
 ctx.fillStyle='#65e6c1';ctx.beginPath();ctx.arc(player.x,player.y,player.r,0,Math.PI*2);ctx.fill();
 ctx.strokeStyle='#d8fff3';ctx.lineWidth=3;ctx.beginPath();ctx.arc(player.x,player.y,player.r+4,0,Math.PI*2);ctx.stroke();
 ctx.restore();
 ctx.fillStyle='#d7e6f5';ctx.font='12px Arial';ctx.fillText('YOU',player.x-12,player.y-21);
}
resize();
})();
</script>
</body>
</html>
